spring:
  application:
    name: agendara

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:""}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:}

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8081}
    key: ${EVOLUTION_API_KEY:}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  access-token-assinaturas: ${MERCADOPAGO_ACCESS_TOKEN_ASSINATURAS:}
  app-id: ${MERCADOPAGO_APP_ID:}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
  redirect-uri: ${MERCADOPAGO_REDIRECT_URI:https://api.oagendara.com.br/painel/mercadopago/callback}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  webhook-secret-marketplace: ${MERCADOPAGO_WEBHOOK_SECRET_MARKETPLACE:}
  planos:
    standard: ${MERCADOPAGO_PLANOS_STANDARD:}
    elite: ${MERCADOPAGO_PLANOS_ELITE:}
    platinum: ${MERCADOPAGO_PLANOS_PLATINUM:}

r2:
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:agendara-fotos}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:}